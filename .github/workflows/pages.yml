# Temporary review deployment to GitHub Pages at https://prucnalj.github.io/One2One/
# Production hosting is Netlify (see netlify.toml); this workflow only exists so
# the site can be previewed without a Netlify account. Netlify Forms do not run
# here, so the two forms on the preview will not submit.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # .npmrc pins npm's script shell to Git Bash on Windows; override on Linux.
  npm_config_script_shell: /bin/bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://prucnalj.github.io
          BASE_PATH: /One2One
          PUBLIC_NOINDEX: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
